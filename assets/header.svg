<svg viewBox="0 0 1200 220" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1" />
      <stop offset="50%" style="stop-color:#7C3AED" />
      <stop offset="100%" style="stop-color:#8B5CF6" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="220" fill="url(#bg)" />

  <!-- Accent line under title -->
  <rect x="475" y="108" width="250" height="3" rx="1.5" fill="url(#accent)" />

  <!-- Main heading -->
  <text x="600" y="88" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="#FFFFFF" letter-spacing="1">
    Mohamad Kazemi
  </text>

  <!-- Subtitle -->
  <text x="600" y="140" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="rgba(255,255,255,0.80)" letter-spacing="0.5">
    Software Engineer  ·  AI &amp; Systems
  </text>

  <!-- Tagline -->
  <text x="600" y="175" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="300" fill="rgba(255,255,255,0.55)">
    Building software that matters
  </text>
</svg>
